name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ml-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [credit-scoring, forecasting]
    defaults:
      run:
        working-directory: ml-services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-services/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v -rs   # -rs prints why tests were skipped (e.g. no model committed yet)

  play-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: try-chama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"      # match the Java version you use locally
      - uses: sbt/setup-sbt@v1
      - run: sbt compile
      - run: sbt test             # remove this line if your tests need a live database
