# This is the main configuration file for the application.
# https://www.playframework.com/documentation/latest/ConfigFile

# ---- Database ----
# Secrets are read from environment variables (see .env.example). None are stored in this file.
db.default.driver=com.mysql.cj.jdbc.Driver
db.default.url="jdbc:mysql://localhost:3306/chama_app"
db.default.url=${?DB_URL}
db.default.username=${?DB_USER}
db.default.password=${?DB_PASS}
db.default.password=${?DB_PASSWORD}

ebean.default=["models.*"]

# CSRF filter is currently disabled.
# TODO (Sprint III): re-enable play.filters.csrf and send the token with every POST.
play.filters.enabled = [
  "play.filters.headers.SecurityHeadersFilter",
  "play.filters.hosts.AllowedHostsFilter",
]

# Evolutions are OFF for local development (you manage the MySQL schema yourself).
# Docker switches them ON so an empty database gets its tables on first start.
play.evolutions.db.default.enabled=false
play.evolutions.db.default.enabled=${?EVOLUTIONS_ENABLED}
play.evolutions.db.default.autoApply=false
play.evolutions.db.default.autoApply=${?EVOLUTIONS_AUTO_APPLY}

play.http.secret.key = "dev-only-not-for-production-min-32-chars-key!"
play.http.secret.key = ${?APPLICATION_SECRET}
